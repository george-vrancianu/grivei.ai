# The reviewed identity overrides (ADR 0003). Read by `pipeline rebuild`; the ONLY hand curation of identity in the graph.
# Values are never hand-curated (Data caveats), and nothing here splits a joint venture: an entry names one supplier, a
# consortium's name is one supplier.
#
# An entry is a `[[override]]` table with a reason (required: who/what/why, so a reviewer can check it) and a target `key`:
#
#   reason       why this override is right. Required.
#   published_id a tax id as SEAP publishes it that is wrong (fails the check digit, or belongs to someone else) ...
#   name         ... or the name of a supplier published without a usable CUI (matched on the whole name, case, diacritics,
#                punctuation and spacing folded). Exactly one of the two.
#   key          the entity to attach to: a CUI that passes the check digit (the entity ANAF knows under it), or a pinned key
#                for a name-only entity (`[a-z][a-z0-9-]*`, e.g. `consortium-example`; not `vat-...` or `name-...`).
#   display_name optional; the display name of a pinned name-only entity (otherwise its most frequent spelling).
#
# An entity an override touches is `identityCurated` and the Records it applied to carry the IDENTITY_CURATED badge.
# A 13-digit id (a CNP) is refused anywhere in this file. Keep it short and reviewed; a real entry looks like:
#
# [[override]]
# reason = "Fictional example: the winner of CAN0000001 is published without a CUI; the notice's PDF names this company."
# name = "ASOCIEREA EXEMPLU ALFA-BETA"
# key = "consortium-exemplu-alfa-beta"
# display_name = "Asocierea Exemplu Alfa-Beta"
#
# People (ONRC administrators, ADR 0011; `pipeline/onrc/people.py`) have two kinds of entry of their own, in this same file. Both need a `reason` and a
# `reviewer`, the named human who reviewed it (never an agent); a merge also needs a `document`, the cited document that shows the records are one person.
# Person ids are the ones a person's page shows (Private view) and the review queue (`onrc.possible_match.id`) lists. They depend on the secret
# `GRIVEI_PERSON_ID_SECRET`, so an entry is valid only for the host that holds that secret.
#
#   [[person_split]]  carve roles out of a confirmed person (a credible request, or evidence that two people share a name and date):
#   person   = "<32-hex person id>"
#   reg_nos  = ["J40/1234/2010"]       # the registrations whose roles move to a new person (a new id)
#   reason   = "..."
#   reviewer = "Full Name"
#
#   [[person_merge]]  settle a possible match, or merge two confirmed persons: every role of `ids` takes the first id:
#   ids      = ["<32-hex id>", "<32-hex id>"]
#   reason   = "..."
#   reviewer = "Full Name"
#   document = "the cited document (title, number, URL)"
#
# An entry that matches no role in the newest snapshot changes nothing and is named in the rebuild's summary.
