# /explore/search?...&tab=<tab>&page=<n>: the paginated "show all" view, one operation per tab.
query FullResultsAuthorities($filter: RecordFilter!, $limit: Int!, $offset: Int!) {
  seap {
    search(filter: $filter) {
      total { ...TotalFields }
      authorities(limit: $limit, offset: $offset) { ...EntityResultPageFields }
    }
  }
}

query FullResultsSuppliers($filter: RecordFilter!, $limit: Int!, $offset: Int!) {
  seap {
