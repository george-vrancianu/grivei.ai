query FullResultsRecords($filter: RecordFilter!, $limit: Int!, $offset: Int!, $order: RecordOrder) {
  seap {
    search(filter: $filter) {
      total { ...TotalFields }
      records(limit: $limit, offset: $offset, order: $order) { ...RecordResultFields }
    }
  }
}
