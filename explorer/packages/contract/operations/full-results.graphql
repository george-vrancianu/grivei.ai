# /explore/search?...&tab=<tab>&page=<n>: the paginated "show all" view, one operation per tab.
query FullResultsAuthorities($filter: RecordFilter!, $limit: Int!, $offset: Int!) {
  seap {
    search(filter: $filter) {
      total { ...TotalFields }
      authorities(limit: $limit, offset: $offset) {
        count
        countEstimated
        rows { entity { ...EntityRowFields } matched { ...TotalFields } }
      }
    }
  }
}

query FullResultsSuppliers($filter: RecordFilter!, $limit: Int!, $offset: Int!) {
  seap {
    search(filter: $filter) {
      total { ...TotalFields }
      suppliers(limit: $limit, offset: $offset) {
        count
        countEstimated
        rows { entity { ...EntityRowFields } matched { ...TotalFields } }
      }
    }
  }
}

query FullResultsRecords($filter: RecordFilter!, $limit: Int!, $offset: Int!, $order: RecordOrder) {
  seap {
    search(filter: $filter) {
      total { ...TotalFields }
      records(limit: $limit, offset: $offset, order: $order) {
        count
        rows {
          record { ...RecordRowFields }
          matchedField { field text highlights }
        }
      }
    }
  }
}
