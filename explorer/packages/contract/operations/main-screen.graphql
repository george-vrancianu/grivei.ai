# /explore/?q=deszapezire&from=2024-01-01&county=RO-BV&tab=suppliers
# One keystroke, one operation: everything on the main screen from one matching set.
query MainScreen($filter: RecordFilter!) {
  sources { ...DataThroughFields }
  seap {
    # the lists the Party chip offers (#181): independent of the filter, cached for the load, so asking beside the search costs nothing
    partyOptions { party records }
    search(filter: $filter) {
      filter { qFolded authority { ...EntityRef } supplier { ...EntityRef } }
      total { ...TotalFields partyCoverage { ...PartyCoverageFields } }
      map { ...MoneyMapFields }
      goTo { ...EntityRef seap { roles } }
      facets { procedure { value } }
      authorities(limit: 50) { ...EntityResultPageFields }
      suppliers(limit: 50) { ...EntityResultPageFields }
      records(limit: 50) { ...RecordResultFields }
    }
  }
}

# Zoomed county: the UAT choropleth, plus the UAT list so absent UATs draw grey.
query ZoomedCounty($filter: RecordFilter!, $county: CountyCode!) {
  uats(county: $county) { siruta name county { code name } }
  seap {
    search(filter: $filter) {
      total { ...TotalFields }
      uatMap(county: $county) {
        uats { area name entities total { ...TotalFields } }
        unknownUat { ...TotalFields }
      }
    }
  }
}
