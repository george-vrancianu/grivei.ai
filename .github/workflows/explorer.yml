name: explorer

on:
  pull_request:
    paths:
      - "explorer/**"
      - ".github/workflows/explorer.yml"
  push:
    branches: [main]
    paths:
      - "explorer/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm ci
      # contract: generated types and the persisted-query allowlist are up to date, typecheck,
      # every operation validates against the schema, every fixture matches its operation.
      - run: npm run check
